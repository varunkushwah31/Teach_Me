services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: teachme-db
    environment:
      - POSTGRES_USER=springai
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=vectordb
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U springai -d vectordb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local AI Engine (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: teachme-ollama
    ports:
      - "11434:11434"
    volumes:
       - D:/Ollama:/root/.ollama
    deploy:
       resources:
         reservations:
           devices:
             - driver: nvidia
               count: 1
               capabilities: [gpu]
    restart: always
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Spring Boot Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teachme-backend
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/vectordb
      - SPRING_DATASOURCE_USERNAME=springai
      - SPRING_DATASOURCE_PASSWORD=secret
      - SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434
      - JWT_SECRET_KEY=92f32d34fbc9ea47b621ff2fba4259439dd57b41077d75a3c5a5b9b892b61311
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend (Nginx + React) - Local Development
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teachme-frontend
    ports:
      - "5175:80"
    depends_on:
      - backend
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3