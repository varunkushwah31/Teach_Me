version: '3.8'

services:
  # 1. The Database (PostgreSQL + pgvector)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: teachme-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=teachme
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teachme"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. The Local AI Engine (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: teachme-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Pass your RTX 4050 GPU into the container for fast inference
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # 3. Your Spring Boot Backend
  backend:
    build: .
    container_name: teachme-backend
    ports:
      - "8081:8081"
    environment:
      # Override Spring Boot properties via environment variables
      # We must use the container names ('postgres' and 'ollama') instead of 'localhost'
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/teachme
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  pg_data:
  ollama_data: