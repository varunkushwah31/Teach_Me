services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: spring-ai-pgvector
    environment:
      - POSTGRES_USER=springai
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=vectordb
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    restart: always