version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: teachme-db
    environment:
      - POSTGRES_USER=springai
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=vectordb
    ports:
      - "5433:5432" # ✅ Forces Docker to use 5433, avoiding the Windows port clash
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U springai -d vectordb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. The Local AI Engine (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: teachme-ollama
    ports:
      - "11434:11434"
    volumes:
      - C:/Users/prach/.ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: always

  # 3. Your Spring Boot Backend
  backend:
    build: .
    container_name: teachme-backend
    ports:
      - "8082:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/vectordb
      - SPRING_DATASOURCE_USERNAME=springai
      - SPRING_DATASOURCE_PASSWORD=secret
      - SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: always