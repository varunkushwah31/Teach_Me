# Render Deployment: Backend (Spring Boot with Java 25) - render.yaml
services:
  - type: web
    name: teachme-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: teachme-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: teachme-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: teachme-db
          property: password
      - key: SPRING_AI_OLLAMA_BASE_URL
        value: "http://localhost:11434"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SPRING_PROFILES_ACTIVE
        value: docker
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173"
      - key: PORT
        value: "8081"

databases:
  - name: teachme-db
    databaseName: vectordb
    user: springai
    plan: free
    region: oregon