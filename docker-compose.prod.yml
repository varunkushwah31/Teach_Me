# Production Docker Compose - Self-hosted with Ollama
# Use this for VPS / Cloud VM deployment (not Render/Vercel)
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: teachme-db
    environment:
      - POSTGRES_USER=springai
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=vectordb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U springai -d vectordb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Ollama - Self-hosted LLM
  # For production, consider:
  # 1. Dedicated GPU instance (RunPod, Lambda Labs, vast.ai)
  # 2. Ollama Cloud (when available)
  # 3. Managed LLM APIs (OpenAI, Anthropic, Groq) - update Spring AI config
  ollama:
    image: ollama/ollama:latest
    container_name: teachme-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: always
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teachme-backend
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/vectordb
      - SPRING_DATASOURCE_USERNAME=springai
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - SPRING_PROFILES_ACTIVE=docker
      - CORS_ALLOWED_ORIGINS=https://your-domain.com
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teachme-frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Reverse proxy with SSL (Traefik/Caddy)
  # Uncomment and configure for production HTTPS
  # proxy:
  #   image: traefik:v3.0
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - ./traefik.yml:/etc/traefik/traefik.yml:ro
  #     - ./acme.json:/acme.json
  #   depends_on:
  #     - frontend
  #     - backend

volumes:
  postgres_data:
  ollama_data: