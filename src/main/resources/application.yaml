spring:
  application:
    name: TeachMe

  servlet:
    multipart:
      max-file-size: 8388608
      max-request-size: 8388608

  datasource:
    url: jdbc:postgresql://localhost:5433/vectordb
    username: springai
    password: secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          fetch_size: 50
          batch_size: 10
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: deepseek-r1:8b
        keep-alive: 0m
      embedding:
        model: nomic-embed-text
        keep-alive: 0m

    vectorstore:
      pgvector:
        dimensions: 768
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        initialize-schema: true

  devtools:
    restart:
      enabled: true

server:
  port: 8081
  tomcat:
    connection-timeout: 10000ms
    keep-alive-timeout: 60000ms
    max-http-form-post-size: 10MB
  max-http-request-header-size: 16KB

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: TeachMe-RAG-Engine

info:
  app:
    name: "TeachMe AI Backend"
    description: "Enterprise RAG Pipeline"
    version: "1.0.0"

application:
  security:
    jwt:
      # Inject via environment variable — no fallback default, so the app fails
      # fast with a clear error rather than starting with an insecure literal key.
      # Generate a key: openssl rand -base64 32
      # Set in production: JWT_SECRET_KEY=<your-key>
      secret-key: ${JWT_SECRET_KEY}
      expiration: 86400000  # 1 day in milliseconds

# CORS allowed origins.
# Default covers local development on Vite (5173) and CRA (3000).
# Override in production: CORS_ALLOWED_ORIGINS=https://app.teachme.example.com
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}