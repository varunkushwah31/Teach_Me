spring:
  application:
    name: TeachMe
  # --- PostgreSQL Connection ---
  datasource:
    url: jdbc:postgresql://localhost:5433/vectordb
    username: springai
    password: secret
    driver-class-name: org.postgresql.Driver

  # --- Spring AI & Ollama Configuration ---
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: deepseek-r1:8b
        keep-alive: 0m
      embedding:
        model: nomic-embed-text
        keep-alive: 0m

    # --- pgvector Configuration ---
    vectorstore:
      pgvector:
        dimensions: 768
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        initialize-schema: true

# --- Spring Boot Server Configuration ---
server:
  port: 8081
  netty:
    connection-timeout: 10000s
    idle-timeout: 60s
    # Increase max header size for huge JWTs or context parameters
    max-http-request-header-size: 16KB

# ==========================================
# ACTUATOR & OBSERVABILITY CONFIGURATION
# ==========================================
management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: TeachMe-RAG-Engine

# --- Application Info Metadata ---
info:
  app:
    name: "TeachMe AI Backend"
    description: "Enterprise RAG Pipeline"
    version: "1.0.0"

# Add this under your existing configuration
application:
  security:
    jwt:
      # This is a generated 256-bit secure hex key. In production, inject this via environment variables!
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000 # 1 day in milliseconds

# --- WebFlux & Netty Tuning ---

  webflux:
    base-path: /