spring:
  application:
    name: TeachMe

  # --- File Upload Limits ---
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # --- PostgreSQL Connection ---
  datasource:
    url: jdbc:postgresql://localhost:5433/vectordb # Point to the safe port
    username: springai
    password: secret
    driver-class-name: org.postgresql.Driver

  # --- JPA & Hibernate Configuration ---
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          fetch_size: 50
          batch_size: 10
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false

  # --- Spring AI & Ollama Configuration ---
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: deepseek-r1:8b
        keep-alive: 0m
      embedding:
        model: nomic-embed-text
        keep-alive: 0m

    # --- pgvector Configuration ---
    vectorstore:
      pgvector:
        dimensions: 768
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        initialize-schema: true

  # --- DevTools ---
  devtools:
    restart:
      enabled: true

# --- Spring Boot Server (Tomcat) Configuration ---
server:
  port: 8081
  tomcat:
    connection-timeout: 10000ms
    keep-alive-timeout: 60000ms
    max-http-form-post-size: 10MB # Helpful for uploading large PDF documents
  max-http-request-header-size: 16KB

# ==========================================
# ACTUATOR & OBSERVABILITY CONFIGURATION
# ==========================================
management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: TeachMe-RAG-Engine

# --- Application Info Metadata ---
info:
  app:
    name: "TeachMe AI Backend"
    description: "Enterprise RAG Pipeline"
    version: "1.0.0"

# --- Custom Security Configuration ---
application:
  security:
    jwt:
      # This is a generated 256-bit secure hex key. In production, inject this via environment variables!
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000 # 1 day in milliseconds