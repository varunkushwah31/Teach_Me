spring:
  application:
    name: TeachMe

  # --- PostgreSQL Connection ---
  datasource:
    url: jdbc:postgresql://localhost:5433/vectordb
    username: springai
    password: secret
    driver-class-name: org.postgresql.Driver

  # --- Spring AI & Ollama Configuration ---
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: deepseek-r1:8b
        keep-alive: 0m
      embedding:
        model: nomic-embed-text
        keep-alive: 0m

    # --- pgvector Configuration ---
    vectorstore:
      pgvector:
        dimensions: 768
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        initialize-schema: true

# --- Spring Boot Server Configuration ---
server:
  port: 8081

# ==========================================
# ACTUATOR & OBSERVABILITY CONFIGURATION
# ==========================================
management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: TeachMe-RAG-Engine

# --- Application Info Metadata ---
info:
  app:
    name: "TeachMe AI Backend"
    description: "Enterprise RAG Pipeline"
    version: "1.0.0"